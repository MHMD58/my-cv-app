<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صانع السير الذاتية الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-8">
        
        <!-- قسم إدخال البيانات -->
        <div class="bg-white p-6 rounded-2xl shadow-lg space-y-6">
            <h1 class="text-2xl font-bold text-gray-800 border-b pb-3">✍️ تطوير وتعديل السيرة الذاتية</h1>
            
            <div class="space-y-4">
                <!-- اختيار اللون -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">🎨 لون السيرة الذاتية الأساسي</label>
                    <div class="flex gap-3">
                        <button onclick="changeTheme('blue', '#2563eb')" class="w-8 h-8 rounded-full bg-blue-600 border-2 border-white shadow focus:ring-2 focus:ring-blue-400"></button>
                        <button onclick="changeTheme('emerald', '#059669')" class="w-8 h-8 rounded-full bg-emerald-600 border-2 border-white shadow focus:ring-2 focus:ring-emerald-400"></button>
                        <button onclick="changeTheme('purple', '#7c3aed')" class="w-8 h-8 rounded-full bg-purple-600 border-2 border-white shadow focus:ring-2 focus:ring-purple-400"></button>
                        <button onclick="changeTheme('rose', '#e11d48')" class="w-8 h-8 rounded-full bg-rose-600 border-2 border-white shadow focus:ring-2 focus:ring-rose-400"></button>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700">الاسم الكامل</label>
                    <input type="text" id="input-name" placeholder="مثال: أحمد محمد" class="w-full mt-1 p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" oninput="updateCV()">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700">المسمى الوظيفي / التخصص</label>
                    <input type="text" id="input-title" placeholder="مثال: مبرمج ويب / طالب ثانوي" class="w-full mt-1 p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" oninput="updateCV()">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">البريد الإلكتروني</label>
                        <input type="email" id="input-email" placeholder="name@example.com" class="w-full mt-1 p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" oninput="updateCV()">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700">رقم الجوال</label>
                        <input type="text" id="input-phone" placeholder="+966 5XXXXXXXX" class="w-full mt-1 p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" oninput="updateCV()">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700">نبذة تعريفية</label>
                    <textarea id="input-summary" rows="2" placeholder="اكتب نبذة مختصرة عنك..." class="w-full mt-1 p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" oninput="updateCV()"></textarea>
                </div>

                <!-- قسم التعليم الجديد -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700">🎓 التعليم / المدرسة أو الجامعة</label>
                    <input type="text" id="input-education" placeholder="مثال: الثانوية العامة - معدل 98%" class="w-full mt-1 p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" oninput="updateCV()">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700">الخبرات والأنشطة (كل سطر نقطة)</label>
                    <textarea id="input-experience" rows="2" placeholder="مشروع تخرج، دورة تدريبية..." class="w-full mt-1 p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" oninput="updateCV()"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700">المهارات (افصل بينها بفاصلة)</label>
                    <input type="text" id="input-skills" placeholder="برمجة, تصميم, إنجليزي" class="w-full mt-1 p-3 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none" oninput="updateCV()">
                </div>
            </div>

            <button onclick="downloadPDF()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition duration-200 shadow-md" id="download-btn">
                📥 تحميل السيرة الذاتية (PDF)
            </button>
        </div>

        <!-- قسم المعاينة الحية -->
        <div class="bg-gray-50 flex justify-center items-start">
            <div id="cv-preview" class="bg-white w-full max-w-[210mm] min-h-[297mm] p-8 md:p-12 shadow-2xl rounded-xl space-y-6 border border-gray-200">
                
                <div class="border-b pb-6 text-right">
                    <h2 id="preview-name" class="text-3xl font-extrabold text-gray-900">اسمك هنا</h2>
                    <p id="preview-title" class="text-lg font-medium text-blue-600 mt-1 theme-text">المسمى الوظيفي أو التخصص</p>
                    <div class="flex flex-wrap gap-4 text-sm text-gray-600 mt-3">
                        <span id="preview-email">📧 name@example.com</span>
                        <span id="preview-phone">📱 +966 5XXXXXXXX</span>
                    </div>
                </div>

                <div>
                    <h3 class="text-md font-bold text-gray-800 border-b border-gray-300 pb-1 mb-2">نبذة شخصية</h3>
                    <p id="preview-summary" class="text-gray-600 text-sm leading-relaxed whitespace-pre-line">اكتب نبذتك الشخصية وستظهر هنا...</p>
                </div>

                <!-- معاينة التعليم -->
                <div>
                    <h3 class="text-md font-bold text-gray-800 border-b border-gray-300 pb-1 mb-2">التعليم</h3>
                    <p id="preview-education" class="text-gray-600 text-sm">اسم المدرسة أو التخصص والشهادة...</p>
                </div>

                <div>
                    <h3 class="text-md font-bold text-gray-800 border-b border-gray-300 pb-1 mb-2">الخبرات والأنشطة</h3>
                    <div id="preview-experience" class="text-gray-600 text-sm space-y-1 whitespace-pre-line">التفاصيل والخبرات ستظهر هنا...</div>
                </div>

                <div>
                    <h3 class="text-md font-bold text-gray-800 border-b border-gray-300 pb-1 mb-2">المهارات</h3>
                    <div id="preview-skills" class="flex flex-wrap gap-2 mt-2">
                        <span class="bg-gray-100 text-gray-700 text-xs px-3 py-1 rounded-full font-medium">المهارة 1</span>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <script>
        let currentThemeColor = '#2563eb';

        function changeTheme(themeName, hexColor) {
            currentThemeColor = hexColor;
            const themeElements = document.querySelectorAll('.theme-text');
            themeElements.forEach(el => el.style.color = hexColor);
            document.getElementById('download-btn').style.backgroundColor = hexColor;
        }

        function updateCV() {
            document.getElementById('preview-name').innerText = document.getElementById('input-name').value || 'اسمك هنا';
            document.getElementById('preview-title').innerText = document.getElementById('input-title').value || 'المسمى الوظيفي أو التخصص';
            document.getElementById('preview-email').innerText = '📧 ' + (document.getElementById('input-email').value || 'name@example.com');
            document.getElementById('preview-phone').innerText = '📱 ' + (document.getElementById('input-phone').value || '+966 5XXXXXXXX');
            document.getElementById('preview-summary').innerText = document.getElementById('input-summary').value || 'اكتب نبذتك الشخصية وستظهر هنا...';
            document.getElementById('preview-education').innerText = document.getElementById('input-education').value || 'اسم المدرسة أو التخصص والشهادة...';
            document.getElementById('preview-experience').innerText = document.getElementById('input-experience-input']?.value || document.getElementById('input-experience').value || 'التفاصيل والخبرات ستظهر هنا...';
            
            const skillsInput = document.getElementById('input-skills').value;
            const skillsContainer = document.getElementById('preview-skills');
            if (skillsInput.trim() !== '') {
                const skillsArray = skillsInput.split(',');
                skillsContainer.innerHTML = '';
                skillsArray.forEach(skill => {
                    if(skill.trim() !== '') {
                        const span = document.createElement('span');
                        span.className = 'bg-gray-100 text-gray-700 text-xs px-3 py-1 rounded-full font-semibold border border-gray-200';
                        span.innerText = skill.trim();
                        skillsContainer.appendChild(span);
                    }
                });
            } else {
                skillsContainer.innerHTML = '<span class="bg-gray-100 text-gray-700 text-xs px-3 py-1 rounded-full font-medium">المهارة 1</span>';
            }
        }

        function downloadPDF() {
            const element = document.getElementById('cv-preview');
            const opt = {
                margin:       0,
                filename:     'my-cv.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().from(element).set(opt).save();
        }
    </script>
</body>
</html>
